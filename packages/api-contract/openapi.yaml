openapi: 3.1.0
info:
  title: Nexa Hub API
  version: 0.5.0
  description: |
    Contract v0.5 — endpoints for F0 (discovery), F1 (accounts and authentication),
    F2 (stores and profiles), F3 (public web pages) and F4 (digital product catalogue).
    Operations marked `x-status: proposed` are not in the spec's endpoint list; see
    docs/decisions.md.

    Conventions (apply to every endpoint added later):
    - Money is an integer number of kobo in a `Money` object. Currency is always NGN.
      The client only displays these values; the server computes every price and fee.
    - Every list is cursor-paginated: `{ data: [...], nextCursor: string | null }`.
      Pass `nextCursor` back as `cursor` to get the next page; `null` means no more pages.
    - Every error body is `{ code, message }`. `code` is UPPER_SNAKE_CASE and stable;
      `message` is safe to show to users.
    - Timestamps are ISO 8601 strings in UTC. IDs are opaque strings.
servers:
  - url: https://api.nexahub.ng
    description: Production (not live yet)
  - url: https://staging-api.nexahub.ng
    description: Staging (not live yet)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Me
  - name: Discovery
  - name: Stores
  - name: Products
  - name: Public web

paths:
  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a one-time sign-in code
      description: |
        Sends a 6-digit code by SMS or WhatsApp (phone) or by email. Works for both sign-up and
        sign-in: the server decides whether the account exists at verify time.
        Codes expire after 5 minutes. A new code for the same destination can be requested once
        `resendAvailableAt` has passed (60 seconds). Requesting a new code invalidates the old one.
        Rate limited per phone, device and IP.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            examples:
              sms:
                value: { phone: '+2348031234567', channel: sms }
              email:
                value: { email: 'chidi@example.com', channel: email }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              examples:
                sms:
                  $ref: '#/components/examples/OtpChallengeSms'
        '400':
          description: Invalid phone or email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                phoneInvalid:
                  value:
                    code: PHONE_INVALID
                    message: Enter a valid Nigerian mobile number.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The chosen channel is down. Offer another channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                smsDown:
                  value:
                    code: SMS_UNAVAILABLE
                    message: We can’t send SMS right now. Get your code on WhatsApp or by email instead.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify a code and start a session
      description: |
        At most 5 wrong attempts per challenge; the 6th attempt is refused with OTP_LOCKED and the
        user must request a new code. On success returns a 15-minute access token and a rotating
        refresh token bound to `deviceId`. `isNewUser` is true when this created the account.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            example:
              challengeId: otp_01J0ABCXYZ
              code: '123456'
              deviceId: dev_7f3a9c2e1b
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                newUser:
                  $ref: '#/components/examples/AuthSessionNewUser'
        '400':
          description: Wrong, expired or locked code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: OTP_INVALID
                    message: That code is not right. 3 attempts left.
                expired:
                  value:
                    code: OTP_EXPIRED
                    message: This code has expired. Request a new one.
                locked:
                  value:
                    code: OTP_LOCKED
                    message: Too many wrong attempts. Request a new code to try again.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: |
        Refresh tokens rotate: each one works once. Using an already-used refresh token is treated
        as theft and revokes every session for that user.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: rt_9d8c7b6a5f4e
              deviceId: dev_7f3a9c2e1b
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: at_1a2b3c4d5e
                accessTokenExpiresAt: '2026-11-28T10:15:00Z'
                refreshToken: rt_0f1e2d3c4b5a
        '401':
          description: Refresh token unknown, used, expired or revoked. Sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REFRESH_TOKEN_INVALID
                message: Your session has ended. Please sign in again.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this device's session
      description: Revokes the refresh token. Succeeds even if the token is already invalid.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: rt_9d8c7b6a5f4e
      responses:
        '204':
          description: Signed out
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                seller:
                  $ref: '#/components/examples/MeSeller'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update the signed-in user's profile
      description: |
        Send only the fields to change. Changing `email` sets `emailVerified` to false and sends a
        verification link. `interests` holds up to 3 category slugs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
            example:
              displayName: Chidi Nwosu
              username: chidi_n
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameInvalid:
                  value:
                    code: USERNAME_INVALID
                    message: Usernames are 3–20 characters, start with a letter, and use only a–z, 0–9 and _.
                tooManyInterests:
                  value:
                    code: VALIDATION_ERROR
                    message: Choose up to 3 interests.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Username or email already in use, or the username is reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameTaken:
                  value:
                    code: USERNAME_TAKEN
                    message: That username is taken.
                usernameReserved:
                  value:
                    code: USERNAME_RESERVED
                    message: That username isn’t available.
                emailTaken:
                  value:
                    code: EMAIL_TAKEN
                    message: That email is already linked to another account.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete the signed-in user's account (proposed)
      x-status: proposed
      description: |
        PROPOSED — not in the spec's endpoint list (see docs/decisions.md).
        Deactivates the account and signs out every device immediately. Permanent deletion
        happens 30 days later; signing in again before then cancels it. Records the law requires
        us to keep (orders, ledger) are retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              confirmation: DELETE
      responses:
        '202':
          description: Deactivated; deletion scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
              example:
                deactivatedAt: '2026-11-28T10:00:00Z'
                deletesAt: '2026-12-28T10:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/seller:
    post:
      tags: [Me]
      operationId: becomeSeller
      summary: Upgrade the signed-in buyer to a seller
      description: |
        One tap, no approval, no re-login. Idempotent: calling it again returns the same user.
        The current access token stays valid; roles are always read from the returned user.
      responses:
        '200':
          description: The updated user, now with the seller role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                seller:
                  $ref: '#/components/examples/MeNewSeller'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/email/verification:
    post:
      tags: [Me]
      operationId: sendEmailVerification
      summary: Send (or re-send) the email verification link (proposed)
      x-status: proposed
      description: PROPOSED — the spec mentions an email verification link but lists no endpoint.
      responses:
        '202':
          description: Link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationSent'
              example:
                sentTo: c***@example.com
        '400':
          description: No email on the account, or it is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Add an email address first.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me/data-export:
    get:
      tags: [Me]
      operationId: getDataExport
      summary: Status of the user's data export (proposed)
      x-status: proposed
      description: PROPOSED — the spec requires data export (F1, F13) but lists no endpoint.
      responses:
        '200':
          description: Current export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
              example:
                status: requested
                requestedAt: '2026-11-28T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Me]
      operationId: requestDataExport
      summary: Request a copy of the user's data (proposed)
      x-status: proposed
      description: |
        PROPOSED. Queues an export; the user is emailed a download link when it is ready.
        Idempotent while a request is pending.
      responses:
        '202':
          description: Export requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
              example:
                status: requested
                requestedAt: '2026-11-28T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/usernames/availability:
    get:
      tags: [Me]
      operationId: checkUsername
      summary: Live username availability check (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec requires a live availability check but lists no endpoint.
        Advisory only: PATCH /v1/me re-checks and can still return USERNAME_TAKEN.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          example: chidi_n
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
              examples:
                available:
                  value: { username: chidi_n, available: true, reason: null }
                taken:
                  value: { username: adaeze, available: false, reason: taken }
                reserved:
                  value: { username: admin, available: false, reason: reserved }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/discover/categories:
    get:
      tags: [Discovery]
      operationId: listCategories
      summary: Product categories (also used as interest tags)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: One page of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
              example:
                data:
                  - { id: cat_fashion, slug: fashion, name: Fashion & textiles }
                  - { id: cat_education, slug: education, name: Exam prep & education }
                nextCursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/discover/home:
    get:
      tags: [Discovery]
      operationId: getDiscoverHome
      summary: Home feed sections
      description: |
        Fixed, bounded sections for the Home tab (each at most 10 items).
        "See all" links use the paginated endpoints, e.g. GET /v1/products.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Home sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverHome'
              examples:
                default:
                  $ref: '#/components/examples/DiscoverHomeDefault'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/stores:
    post:
      tags: [Stores]
      operationId: createStore
      summary: Create the signed-in seller's store
      description: |
        One store per seller. The server re-checks the slug (format, reserved names, taken)
        and the uploads; the live availability check is advisory only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreate'
            example:
              name: Bisi Bakes
              slug: bisibakes
              bio: Small-chops and celebration cakes, Surulere.
              categorySlug: food
              avatarUploadId: upl_01J0AVATAR
              bannerUploadId: null
              visibility: public
      responses:
        '201':
          description: The new store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnStore'
        '400':
          $ref: '#/components/responses/StoreValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotSeller'
        '409':
          description: The slug is taken, or the seller already has a store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slugTaken:
                  value:
                    code: SLUG_TAKEN
                    message: That link is already taken. Try another.
                storeExists:
                  value:
                    code: STORE_EXISTS
                    message: You already have a store.
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Stores]
      operationId: updateStore
      summary: Update the signed-in seller's store
      description: |
        Send only the fields that change. The slug can be changed once; the old slug then
        answers GET /v1/stores/{slug} with `redirectTo` set to the new one. An upload id of
        null removes that image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdate'
            examples:
              visibility:
                value: { visibility: private }
              rename:
                value: { slug: adaezetextiles }
      responses:
        '200':
          description: The updated store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnStore'
        '400':
          $ref: '#/components/responses/StoreValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The seller has no store yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: You don’t have a store yet.
        '409':
          description: The slug is taken, or the one allowed slug change was already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slugTaken:
                  value:
                    code: SLUG_TAKEN
                    message: That link is already taken. Try another.
                slugChangeUsed:
                  value:
                    code: SLUG_CHANGE_USED
                    message: You’ve already changed your store link once.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me/store:
    get:
      tags: [Stores]
      operationId: getMyStore
      summary: The signed-in seller's own store (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec lists no "my store" read. Returns the store with owner-only
        fields, including private stores. 404 when the seller has not created one yet.
      responses:
        '200':
          description: The seller's store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No store yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: You don’t have a store yet.

  /v1/me/store/uploads:
    post:
      tags: [Stores]
      operationId: requestStoreUpload
      summary: Pre-signed upload for a store avatar or banner (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec requires pre-signed uploads but lists no endpoint. The app PUTs
        the file straight to `uploadUrl` with `headers` (never through the API server), then
        sends `uploadId` in POST or PATCH /v1/stores. The server makes three resized
        variants (small, medium, large) and returns them on the store.
        Limits: jpeg, png or webp; avatar 5 MB, banner 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            example:
              kind: banner
              contentType: image/jpeg
              sizeBytes: 812345
      responses:
        '201':
          description: Where to upload the file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
              example:
                uploadId: upl_01J0BANNER
                uploadUrl: https://uploads.nexahub.ng/store-banners/upl_01J0BANNER?signature=abc
                method: PUT
                headers: { Content-Type: image/jpeg }
                expiresAt: '2026-11-28T10:15:00Z'
                maxBytes: 10485760
        '400':
          description: The file type or size is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: FILE_TOO_LARGE
                    message: Banners can be up to 10 MB.
                typeNotAllowed:
                  value:
                    code: FILE_TYPE_NOT_ALLOWED
                    message: Use a JPEG, PNG or WebP image.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotSeller'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/slugs/availability:
    get:
      tags: [Stores]
      operationId: checkSlug
      summary: Live store-link availability check (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec requires slug rules but lists no availability endpoint.
        Advisory only: POST and PATCH /v1/stores re-check and can still return SLUG_TAKEN.
        The seller's own current slug is reported as available.
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          example: bisibakes
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
              examples:
                available:
                  value: { slug: bisibakes, available: true, reason: null }
                taken:
                  value: { slug: adaezeprints, available: false, reason: taken }
                reserved:
                  value: { slug: admin, available: false, reason: reserved }
                invalid:
                  value: { slug: Bisi Bakes, available: false, reason: invalid }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/stores/{slug}:
    get:
      tags: [Stores]
      operationId: getStore
      summary: A public store by its slug
      description: |
        Public read (cache at the edge for signed-out requests). When `slug` is a store's old
        slug the store is returned with `redirectTo` set to its current slug; clients replace
        the route. Private stores return 403 STORE_PRIVATE to everyone except the owner.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Slug'
          example: adaezeprints
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
              examples:
                default:
                  $ref: '#/components/examples/StoreAdaeze'
                oldSlug:
                  $ref: '#/components/examples/StoreAdaezeRedirect'
        '403':
          description: The store is private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: STORE_PRIVATE
                message: This store is private.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/stores/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: str_01HZX3M1A7
    post:
      tags: [Stores]
      operationId: followStore
      summary: Follow a store
      description: Idempotent. Owners cannot follow their own store.
      responses:
        '200':
          description: The new follow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
              example:
                storeId: str_01HZX3M1A7
                following: true
                followerCount: 12481
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Following your own store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CANNOT_FOLLOW_OWN_STORE
                message: You can’t follow your own store.
    delete:
      tags: [Stores]
      operationId: unfollowStore
      summary: Unfollow a store (proposed)
      x-status: proposed
      description: PROPOSED — the spec lists follow and unfollow but only POST. Idempotent.
      responses:
        '200':
          description: The new follow state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
              example:
                storeId: str_01HZX3M1A7
                following: false
                followerCount: 12480
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Live products, newest first; or the seller's own products
      description: |
        Public: live, public products of public stores (never unlisted, draft or unpublished).
        With `owner=me` (seller, signed in): the seller's own products in `state`, as
        OwnProductPage, including sales counts and upload status.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` from the previous page. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: storeSlug
          in: query
          required: false
          description: Only products from this store
          schema:
            $ref: '#/components/schemas/Slug'
        - name: owner
          in: query
          required: false
          description: "`me`: the signed-in seller's own products (needs a token)."
          schema:
            type: string
            enum: [me]
        - name: state
          in: query
          required: false
          description: With owner=me. Default live.
          schema:
            $ref: '#/components/schemas/ProductState'
      responses:
        '200':
          description: One page of products (OwnProductPage when owner=me)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProductPage'
                  - $ref: '#/components/schemas/OwnProductPage'
              examples:
                firstPage:
                  $ref: '#/components/examples/ProductPageFirst'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Start a product (a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example: { typeCode: A1, title: Ankara Pattern Guide }
      responses:
        '201':
          description: The new draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '400':
          description: Unknown type, title too long, or a mode the type doesn't allow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceTooLow:
                  value: { code: PRICE_TOO_LOW, message: The minimum price is ₦100. }
                titleTooLong:
                  value: { code: TITLE_TOO_LONG, message: Titles can be up to 80 characters. }
                categoryNotAllowed:
                  value:
                    code: CATEGORY_NOT_ALLOWED
                    message: That category isn’t allowed on Nexa Hub.
                linkInvalid:
                  value: { code: LINK_INVALID, message: Enter a full https:// link. }
                modeNotAllowed:
                  value:
                    code: MODE_NOT_ALLOWED
                    message: This product type can’t be delivered that way.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotSeller'

  /v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Products]
      operationId: getOwnProduct
      summary: The seller's own product (any state)
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update a product (also used by draft autosave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '400':
          description: A field breaks a rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceTooLow:
                  value: { code: PRICE_TOO_LOW, message: The minimum price is ₦100. }
                titleTooLong:
                  value: { code: TITLE_TOO_LONG, message: Titles can be up to 80 characters. }
                categoryNotAllowed:
                  value:
                    code: CATEGORY_NOT_ALLOWED
                    message: That category isn’t allowed on Nexa Hub.
                linkInvalid:
                  value: { code: LINK_INVALID, message: Enter a full https:// link. }
                modeNotAllowed:
                  value:
                    code: MODE_NOT_ALLOWED
                    message: This product type can’t be delivered that way.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/uploads:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Products]
      operationId: startProductUpload
      summary: Start (or resume) a pre-signed multipart upload
      description: |
        The app PUTs each part straight to storage (never through the API) and keeps each
        part's ETag. Send `uploadId` again to resume: the answer lists the parts storage already
        has and fresh URLs for the rest. Finish with .../complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStart'
            example:
              kind: main
              fileName: ankara-guide.pdf
              contentType: application/pdf
              sizeBytes: 14680064
      responses:
        '201':
          description: Where to send the parts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartUpload'
        '400':
          description: File type or size not allowed for this product type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value: { code: FILE_TOO_LARGE, message: Ebooks can be up to 200 MB. }
                typeNotAllowed:
                  value: { code: FILE_TYPE_NOT_ALLOWED, message: Upload a PDF. }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/uploads/{uploadId}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Products]
      operationId: completeProductUpload
      summary: Finish a multipart upload (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec lists pre-signed uploads but not how multipart ends. The asset then
        moves scanning → processing → ready (or rejected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadComplete'
      responses:
        '200':
          description: The asset (now scanning)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/uploads/{uploadId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Products]
      operationId: abortProductUpload
      summary: Cancel a multipart upload (proposed)
      x-status: proposed
      description: PROPOSED. Storage drops the parts already sent.
      responses:
        '204':
          description: Cancelled
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Products]
      operationId: publishProduct
      summary: Publish a draft
      description: |
        Refused until the main content is ready (file asset ready, or a valid link), the cover
        is set, the price is at least ₦100, and — for types that need it — the rights
        declaration is recorded. Flagged listings go to pending_review instead of live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: The product, now live (or pending_review)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '409':
          description: Not ready to publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetNotReady:
                  value: { code: ASSET_NOT_READY, message: Your file is still being checked. }
                coverRequired:
                  value: { code: COVER_REQUIRED, message: Add a cover image. }
                rights:
                  value:
                    code: RIGHTS_DECLARATION_REQUIRED
                    message: Confirm you own the rights to this content.
                priceTooLow:
                  value: { code: PRICE_TOO_LOW, message: The minimum price is ₦100. }
                linkInvalid:
                  value: { code: LINK_INVALID, message: Add the link buyers get. }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/unpublish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Products]
      operationId: unpublishProduct
      summary: Take a product off sale (proposed)
      x-status: proposed
      description: |
        PROPOSED. Leaves every public list, the sitemap and search; the record stays and past
        buyers keep access.
      responses:
        '200':
          description: The product, now unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{id}/republish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Products]
      operationId: republishProduct
      summary: Put an unpublished product back on sale (proposed)
      x-status: proposed
      description: PROPOSED. Same checks as publish; keeps its visibility.
      responses:
        '200':
          description: The product, live again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProduct'
        '409':
          description: Not ready (same codes as publish)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/product-types:
    get:
      tags: [Products]
      operationId: listProductTypes
      summary: The digital product types (proposed)
      x-status: proposed
      description: |
        PROPOSED (approved for F4) — types are data, not code: name, group, allowed content
        modes, file rules, rights requirement and preview kind.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: All types (one page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTypePage'

  /v1/tags:
    get:
      tags: [Products]
      operationId: listTags
      summary: Tag suggestions (proposed)
      x-status: proposed
      description: PROPOSED — tags are data; suggestions for the tag field.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Matching tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'

  /v1/fees/preview:
    get:
      tags: [Products]
      operationId: previewFee
      summary: What the seller receives for a price (proposed)
      x-status: proposed
      description: |
        PROPOSED. The server applies the current fee (5% + ₦10); the app only shows the answer.
      parameters:
        - name: priceKobo
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          example: 150000
      responses:
        '200':
          description: The breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePreview'
              example:
                price: { amountKobo: 150000, currency: NGN }
                fee: { amountKobo: 8500, currency: NGN }
                youReceive: { amountKobo: 141500, currency: NGN }
                label: 5% + ₦10 per sale
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/stores/{storeSlug}/products/{productSlug}:
    get:
      tags: [Products, Public web]
      operationId: getPublicProduct
      summary: A live product by store slug and product slug (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec's public pages need /{store}/{product} but list no endpoint.
        Public read (cache at the edge). Unpublished products and products of private stores
        return 404. When `storeSlug` is the store's old slug, the product is returned with
        `redirectTo` set to the store's current slug.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Slug'
          example: adaezeprints
        - name: productSlug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProductSlug'
          example: ankara-print-pattern-pack-40-designs
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Unknown or draft product, or a private store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: We couldn’t find that product.
        '410':
          description: The product was unpublished (no longer available)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PRODUCT_UNPUBLISHED
                message: This product is no longer available.
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/users/{username}:
    get:
      tags: [Public web]
      operationId: getPublicProfile
      summary: A public user profile (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec's public pages include /@user but list no endpoint. Only public
        fields: never phone, email or interests. `store` is null when the user has no store
        or it is private. Deactivated accounts return 404.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Username'
          example: adaeze
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
              example:
                username: adaeze
                displayName: Adaeze Okafor
                avatarUrl: null
                bio: Textile designer in Yaba.
                store:
                  id: str_01HZX3M1A7
                  slug: adaezeprints
                  name: Adaeze Prints
                  avatarUrl: null
                  location: Yaba, Lagos
                  verified: true
                  followerCount: 12480
                createdAt: '2026-10-02T09:15:00Z'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: We couldn’t find that profile.

  /v1/sitemap:
    get:
      tags: [Public web]
      operationId: listSitemap
      summary: Public pages for sitemap.xml (proposed)
      x-status: proposed
      description: |
        PROPOSED — the spec asks for a sitemap but lists no endpoint. Public stores and live
        products of public stores only; never private stores or unpublished products.
        Paths are relative to the public site (e.g. /adaezeprints/ankara-print-pattern-pack).
      security:
        - {}
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: One page of sitemap entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitemapPage'
              example:
                data:
                  - { type: store, path: /adaezeprints, updatedAt: '2026-11-20T10:00:00Z' }
                  - type: product
                    path: /adaezeprints/ankara-print-pattern-pack-40-designs
                    updatedAt: '2026-11-21T08:30:00Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 15-minute access token from POST /v1/auth/otp/verify (module F1).

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: NOT_FOUND
        message:
          type: string
          example: We couldn’t find that store.

    Money:
      type: object
      description: An amount of Nigerian naira as integer kobo (₦1 = 100 kobo).
      required: [amountKobo, currency]
      properties:
        amountKobo:
          type: integer
          format: int64
          example: 450000
        currency:
          type: string
          enum: [NGN]

    Slug:
      type: string
      description: |
        A store's link. 3–30 characters: lowercase letters, numbers and single hyphens,
        starting and ending with a letter or number.
      pattern: '^(?!.*--)[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'
      minLength: 3
      maxLength: 30
      example: adaezeprints

    Role:
      type: string
      enum: [buyer, seller, ambassador]

    ContentMode:
      type: string
      enum: [STREAM_ONLY, DOWNLOAD_LIMITED, LINK]
      description: |
        How buyers get a digital product. STREAM_ONLY: watched or listened to in the app.
        DOWNLOAD_LIMITED: files (PDF first) with a download limit. LINK: an external link
        revealed only after purchase.

    ProductState:
      type: string
      enum: [draft, pending_review, live, unpublished]
      description: |
        draft → live (or pending_review when flagged) ⇄ unpublished. Unpublished products leave
        every public list but are never deleted: past buyers keep access.

    ProductVisibility:
      type: string
      enum: [public, unlisted]
      description: For live products. Unlisted products open by link but are never listed.

    ProductTypeDef:
      type: object
      description: One of the digital product types (A1–A12, I4). Data, not code.
      required:
        [code, name, description, group, defaultCategorySlug, modes, rightsRequired, files, preview]
      properties:
        code:
          type: string
          example: A1
        name:
          type: string
          example: Ebooks and guides
        description:
          type: string
          example: A PDF guide or ebook buyers read in the app.
        group:
          type: string
          description: Heading for the type picker.
          example: Read and learn
        defaultCategorySlug:
          type: string
        modes:
          type: array
          description: Allowed content modes; the first is the default.
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentMode'
        rightsRequired:
          type: boolean
          description: The seller must declare they own the rights (music, audio, video).
        files:
          description: Main file rules for DOWNLOAD_LIMITED and STREAM_ONLY; null for link-only.
          oneOf:
            - $ref: '#/components/schemas/FileRules'
            - type: 'null'
        preview:
          type: string
          enum: [pages, video_clip, audio_clip, none]
          description: The kind of free preview buyers can see.

    FileRules:
      type: object
      required: [extensions, contentTypes, maxBytes, label]
      properties:
        extensions:
          type: array
          items:
            type: string
          example: [pdf]
        contentTypes:
          type: array
          items:
            type: string
          example: [application/pdf]
        maxBytes:
          type: integer
          format: int64
        label:
          type: string
          example: PDF, up to 200 MB

    ProductTypePage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductTypeDef'
        nextCursor:
          type: [string, 'null']

    Tag:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    TagPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        nextCursor:
          type: [string, 'null']

    FeePreview:
      type: object
      description: Computed by the server. The app never calculates fees.
      required: [price, fee, youReceive, label]
      properties:
        price:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        youReceive:
          $ref: '#/components/schemas/Money'
        label:
          type: string
          example: 5% + ₦10 per sale

    AssetKind:
      type: string
      enum: [main, cover, preview]

    AssetStatus:
      type: string
      enum: [uploading, scanning, processing, ready, rejected]

    ProductAsset:
      type: object
      description: Owner-only. Never contains a file URL.
      required:
        [
          id,
          kind,
          status,
          rejectionReason,
          fileName,
          contentType,
          sizeBytes,
          pageCount,
          durationSeconds,
          createdAt,
        ]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AssetKind'
        status:
          $ref: '#/components/schemas/AssetStatus'
        rejectionReason:
          type: [string, 'null']
          example: The file failed the virus scan.
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        pageCount:
          type: [integer, 'null']
          description: PDFs, once processed.
        durationSeconds:
          type: [integer, 'null']
          description: Audio and video, once processed.
        createdAt:
          type: string
          format: date-time

    ProductPreview:
      type: object
      description: The free preview, the only content of a product that is public.
      required: [pages, clipUrl, clipKind]
      properties:
        pages:
          type: array
          description: Sample pages as images (PDF types).
          items:
            type: string
            format: uri
        clipUrl:
          type: [string, 'null']
          format: uri
        clipKind:
          type: [string, 'null']
          enum: [video, audio, null]

    ContentFacts:
      type: object
      description: Public facts about what the buyer gets. Never a file URL or the link.
      required: [pageCount, durationSeconds, fileSizeBytes, fileLabel]
      properties:
        pageCount:
          type: [integer, 'null']
        durationSeconds:
          type: [integer, 'null']
        fileSizeBytes:
          type: [integer, 'null']
          format: int64
        fileLabel:
          type: [string, 'null']
          example: PDF

    OwnProduct:
      description: The seller's own product, any state. Includes owner-only fields.
      type: object
      required:
        [
          id,
          slug,
          typeCode,
          typeName,
          contentMode,
          state,
          visibility,
          title,
          description,
          categorySlug,
          tags,
          price,
          coverUrl,
          linkUrl,
          previewPages,
          assets,
          mainAssetId,
          coverAssetId,
          previewAssetId,
          preview,
          rightsDeclaredAt,
          salesCount,
          store,
          publishedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        slug:
          $ref: '#/components/schemas/ProductSlug'
        typeCode:
          type: string
        typeName:
          type: string
        contentMode:
          $ref: '#/components/schemas/ContentMode'
        state:
          $ref: '#/components/schemas/ProductState'
        visibility:
          $ref: '#/components/schemas/ProductVisibility'
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        categorySlug:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        price:
          description: null until the seller sets one.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        coverUrl:
          type: [string, 'null']
          format: uri
        linkUrl:
          type: [string, 'null']
          format: uri
          description: LINK products only. Owner-only; never in public responses.
        previewPages:
          type: integer
          minimum: 0
          maximum: 5
          description: PDF types; how many sample pages to show.
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ProductAsset'
        mainAssetId:
          type: [string, 'null']
          description: The file buyers get (null for links or before the first upload).
        coverAssetId:
          type: [string, 'null']
        previewAssetId:
          type: [string, 'null']
        preview:
          $ref: '#/components/schemas/ProductPreview'
        rightsDeclaredAt:
          type: [string, 'null']
          format: date-time
          description: Recorded by the server when the seller ticks the declaration.
        salesCount:
          type: integer
          minimum: 0
        store:
          type: object
          required: [slug, name]
          properties:
            slug:
              $ref: '#/components/schemas/Slug'
            name:
              type: string
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OwnProductPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OwnProduct'
        nextCursor:
          type: [string, 'null']

    ProductCreate:
      type: object
      required: [typeCode]
      properties:
        typeCode:
          type: string
          example: A1
        contentMode:
          $ref: '#/components/schemas/ContentMode'
        title:
          type: string
          maxLength: 80

    ProductUpdate:
      type: object
      description: Send only what changed. Drafts may be incomplete; publish checks the rest.
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        categorySlug:
          type: string
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        price:
          $ref: '#/components/schemas/Money'
        contentMode:
          $ref: '#/components/schemas/ContentMode'
        linkUrl:
          type: [string, 'null']
        previewPages:
          type: integer
          minimum: 0
          maximum: 5
        coverAssetId:
          type: string
        mainAssetId:
          type: string
          description: Replaces the main file (on live products, past buyers get the new file).
        previewAssetId:
          type: [string, 'null']
        rightsDeclared:
          type: boolean
          description: true records the declaration time on the server.
        visibility:
          $ref: '#/components/schemas/ProductVisibility'

    PublishRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: '#/components/schemas/ProductVisibility'

    UploadStart:
      type: object
      required: [kind, fileName, contentType, sizeBytes]
      properties:
        kind:
          $ref: '#/components/schemas/AssetKind'
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        uploadId:
          type: string
          description: Resume an earlier upload; returns fresh URLs for the missing parts only.

    MultipartUpload:
      type: object
      required: [uploadId, assetId, partSize, partCount, completedParts, parts, expiresAt]
      properties:
        uploadId:
          type: string
        assetId:
          type: string
        partSize:
          type: integer
          description: Bytes per part (the last part may be smaller).
        partCount:
          type: integer
        completedParts:
          type: array
          description: Parts storage already has (on resume).
          items:
            $ref: '#/components/schemas/CompletedPart'
        parts:
          type: array
          description: Pre-signed PUT URLs for the parts still to send.
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber:
                type: integer
                minimum: 1
              url:
                type: string
                format: uri
        expiresAt:
          type: string
          format: date-time

    CompletedPart:
      type: object
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
        etag:
          type: string

    UploadComplete:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/CompletedPart'

    StoreSummary:
      type: object
      required: [id, slug, name, avatarUrl, location, verified, followerCount]
      properties:
        id:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        location:
          type: [string, 'null']
          description: Free text, e.g. "Yaba, Lagos"
        verified:
          type: boolean
        followerCount:
          type: integer
          minimum: 0

    Store:
      allOf:
        - $ref: '#/components/schemas/StoreSummary'
        - type: object
          required:
            [
              bio,
              coverUrl,
              productCount,
              isFollowing,
              createdAt,
              category,
              avatar,
              banner,
              visibility,
              isOwner,
              redirectTo,
            ]
          properties:
            bio:
              type: [string, 'null']
              maxLength: 150
            coverUrl:
              type: [string, 'null']
              format: uri
              description: The banner's large variant (kept for F0 clients).
            productCount:
              type: integer
              minimum: 0
            isFollowing:
              type: boolean
              description: Always false when signed out.
            createdAt:
              type: string
              format: date-time
            category:
              oneOf:
                - $ref: '#/components/schemas/Category'
                - type: 'null'
            avatar:
              description: Square avatar in three sizes; null when none.
              oneOf:
                - $ref: '#/components/schemas/ImageVariants'
                - type: 'null'
            banner:
              description: Wide banner (3:1) in three sizes; null when none.
              oneOf:
                - $ref: '#/components/schemas/ImageVariants'
                - type: 'null'
            visibility:
              $ref: '#/components/schemas/StoreVisibility'
            isOwner:
              type: boolean
              description: True when the signed-in user owns this store.
            redirectTo:
              description: Set when the request used an old slug; the store's current slug.
              oneOf:
                - $ref: '#/components/schemas/Slug'
                - type: 'null'

    OwnStore:
      description: The seller's own store, with owner-only fields.
      allOf:
        - $ref: '#/components/schemas/Store'
        - type: object
          required: [slugChangesRemaining, previousSlug]
          properties:
            slugChangesRemaining:
              type: integer
              minimum: 0
              maximum: 1
            previousSlug:
              description: The old slug that redirects here, if the slug was changed.
              oneOf:
                - $ref: '#/components/schemas/Slug'
                - type: 'null'

    StoreVisibility:
      type: string
      enum: [public, private]
      description: Private stores are hidden from discovery and their link shows "private".

    ImageVariants:
      type: object
      required: [small, medium, large]
      description: Server-resized copies, served from the CDN.
      properties:
        small:
          type: string
          format: uri
        medium:
          type: string
          format: uri
        large:
          type: string
          format: uri

    StoreCreate:
      type: object
      required: [name, slug, categorySlug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 40
        slug:
          $ref: '#/components/schemas/Slug'
        bio:
          type: [string, 'null']
          maxLength: 150
        categorySlug:
          type: string
        avatarUploadId:
          type: [string, 'null']
        bannerUploadId:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/StoreVisibility'

    StoreUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 40
        slug:
          $ref: '#/components/schemas/Slug'
        bio:
          type: [string, 'null']
          maxLength: 150
        categorySlug:
          type: string
        avatarUploadId:
          type: [string, 'null']
          description: A new upload id, or null to remove the avatar.
        bannerUploadId:
          type: [string, 'null']
          description: A new upload id, or null to remove the banner.
        visibility:
          $ref: '#/components/schemas/StoreVisibility'

    SlugAvailability:
      type: object
      required: [slug, available, reason]
      properties:
        slug:
          type: string
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [taken, reserved, invalid, null]

    FollowState:
      type: object
      required: [storeId, following, followerCount]
      properties:
        storeId:
          type: string
        following:
          type: boolean
        followerCount:
          type: integer
          minimum: 0

    UploadKind:
      type: string
      enum: [avatar, banner]

    UploadRequest:
      type: object
      required: [kind, contentType, sizeBytes]
      properties:
        kind:
          $ref: '#/components/schemas/UploadKind'
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1

    UploadTicket:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt, maxBytes]
      properties:
        uploadId:
          type: string
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer

    ProductSlug:
      type: string
      description: |
        A product's link inside its store (PROPOSED, F3): made from the title when the product
        is created, unique within the store. 3–60 characters, same character rules as Slug.
      pattern: '^(?!.*--)[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$'
      minLength: 3
      maxLength: 60
      example: ankara-print-pattern-pack-40-designs

    ProductSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          typeCode,
          typeName,
          contentMode,
          price,
          compareAtPrice,
          imageUrl,
          store,
          featured,
        ]
      properties:
        id:
          type: string
        slug:
          $ref: '#/components/schemas/ProductSlug'
        title:
          type: string
        typeCode:
          type: string
          description: One of GET /v1/product-types (e.g. A1).
        typeName:
          type: string
          example: Ebooks and guides
        contentMode:
          $ref: '#/components/schemas/ContentMode'
        price:
          $ref: '#/components/schemas/Money'
        compareAtPrice:
          description: Original price when on sale; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        imageUrl:
          type: [string, 'null']
          format: uri
        store:
          type: object
          required: [slug, name]
          properties:
            slug:
              $ref: '#/components/schemas/Slug'
            name:
              type: string
        featured:
          type: boolean

    Product:
      description: |
        A live product as public pages show it (PROPOSED, F3/F4). SECURITY: never contains the
        LINK URL or any file URL; only the cover, preview pages and preview clip are public.
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required:
            [
              description,
              images,
              storeInfo,
              publishedAt,
              redirectTo,
              visibility,
              category,
              tags,
              preview,
              content,
            ]
          properties:
            visibility:
              $ref: '#/components/schemas/ProductVisibility'
            category:
              oneOf:
                - $ref: '#/components/schemas/Category'
                - type: 'null'
            tags:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
            preview:
              $ref: '#/components/schemas/ProductPreview'
            content:
              $ref: '#/components/schemas/ContentFacts'
            description:
              type: [string, 'null']
              maxLength: 500
              description: Short plain-text description.
            images:
              type: array
              description: Cover first. Empty when the product has no images.
              items:
                type: string
                format: uri
            storeInfo:
              $ref: '#/components/schemas/StoreSummary'
            publishedAt:
              type: string
              format: date-time
            redirectTo:
              description: Set when the request used the store's old slug; its current slug.
              oneOf:
                - $ref: '#/components/schemas/Slug'
                - type: 'null'

    PublicProfile:
      type: object
      required: [username, displayName, avatarUrl, bio, store, createdAt]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri
        bio:
          type: [string, 'null']
        store:
          oneOf:
            - $ref: '#/components/schemas/StoreSummary'
            - type: 'null'
        createdAt:
          type: string
          format: date-time

    SitemapEntry:
      type: object
      required: [type, path, updatedAt]
      properties:
        type:
          type: string
          enum: [store, product]
        path:
          type: string
          example: /adaezeprints
        updatedAt:
          type: string
          format: date-time

    SitemapPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SitemapEntry'
        nextCursor:
          type: [string, 'null']

    ProductPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        nextCursor:
          type: [string, 'null']

    DiscoverHome:
      type: object
      required: [featuredStores, trendingProducts, newProducts]
      properties:
        featuredStores:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/StoreSummary'
        trendingProducts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductSummary'
        newProducts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductSummary'

    Me:
      type: object
      required:
        [
          id,
          username,
          displayName,
          avatarUrl,
          bio,
          phone,
          email,
          emailVerified,
          interests,
          roles,
          store,
          createdAt,
        ]
      properties:
        id:
          type: string
        username:
          description: Null until the user picks one during onboarding.
          oneOf:
            - $ref: '#/components/schemas/Username'
            - type: 'null'
        displayName:
          type: [string, 'null']
          maxLength: 50
        avatarUrl:
          type: [string, 'null']
          format: uri
        bio:
          type: [string, 'null']
          maxLength: 160
        phone:
          description: E.164, always +234 for Nigeria. Null for email-only accounts.
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        email:
          type: [string, 'null']
          format: email
        emailVerified:
          type: boolean
        interests:
          type: array
          maxItems: 3
          items:
            type: string
          description: Category slugs (see GET /v1/discover/categories).
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        store:
          description: The user's store if they are a seller and have created one (F2).
          oneOf:
            - $ref: '#/components/schemas/StoreSummary'
            - type: 'null'
        createdAt:
          type: string
          format: date-time

    Username:
      type: string
      description: 3–20 characters, starts with a letter, lowercase a–z, 0–9 and underscore.
      pattern: '^[a-z][a-z0-9_]{2,19}$'
      example: chidi_n

    PhoneE164:
      type: string
      description: Nigerian mobile number in E.164 format.
      pattern: '^\+234[789][01]\d{8}$'
      example: '+2348031234567'

    MeUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        username:
          $ref: '#/components/schemas/Username'
        bio:
          type: [string, 'null']
          maxLength: 160
        email:
          type: string
          format: email
        interests:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string

    OtpChannel:
      type: string
      enum: [sms, whatsapp, email]

    OtpRequest:
      oneOf:
        - $ref: '#/components/schemas/OtpRequestPhone'
        - $ref: '#/components/schemas/OtpRequestEmail'

    OtpRequestPhone:
      type: object
      required: [phone, channel]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        channel:
          type: string
          enum: [sms, whatsapp]

    OtpRequestEmail:
      type: object
      required: [email, channel]
      properties:
        email:
          type: string
          format: email
        channel:
          type: string
          enum: [email]

    OtpChallenge:
      type: object
      required: [challengeId, channel, sentTo, expiresAt, resendAvailableAt]
      properties:
        challengeId:
          type: string
        channel:
          $ref: '#/components/schemas/OtpChannel'
        sentTo:
          type: string
          description: Masked destination for display, e.g. "+234 803 *** 4567".
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time

    OtpVerifyRequest:
      type: object
      required: [challengeId, code, deviceId]
      properties:
        challengeId:
          type: string
        code:
          type: string
          pattern: '^\d{6}$'
        deviceId:
          type: string
          description: Random ID generated once per install and kept in secure storage.

    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken]
      properties:
        accessToken:
          type: string
          description: Valid for 15 minutes.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Single use; rotates on every refresh.

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, isNewUser]
          properties:
            user:
              $ref: '#/components/schemas/Me'
            isNewUser:
              type: boolean

    RefreshRequest:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UsernameAvailability:
      type: object
      required: [username, available, reason]
      properties:
        username:
          type: string
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [taken, reserved, invalid, null]

    EmailVerificationSent:
      type: object
      required: [sentTo]
      properties:
        sentTo:
          type: string

    DeleteAccountRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          const: DELETE

    AccountDeletion:
      type: object
      required: [deactivatedAt, deletesAt]
      properties:
        deactivatedAt:
          type: string
          format: date-time
        deletesAt:
          type: string
          format: date-time

    DataExport:
      type: object
      required: [status, requestedAt]
      properties:
        status:
          type: string
          enum: [none, requested, ready]
        requestedAt:
          type: [string, 'null']
          format: date-time

    Category:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string

    CategoryPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        nextCursor:
          type: [string, 'null']

  responses:
    ValidationError:
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: limit must be between 1 and 50.
    Unauthenticated:
      description: |
        Missing, invalid or expired access token. On ACCESS_TOKEN_EXPIRED the client refreshes
        once (POST /v1/auth/refresh) and retries; on anything else it signs the user out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            expired:
              value:
                code: ACCESS_TOKEN_EXPIRED
                message: Your session needs refreshing.
            missing:
              value:
                code: UNAUTHENTICATED
                message: Please sign in again.
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: We couldn’t find that store.
    StoreValidationError:
      description: A store field is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            slugInvalid:
              value:
                code: SLUG_INVALID
                message: Use 3–30 lowercase letters, numbers or hyphens.
            slugReserved:
              value:
                code: SLUG_RESERVED
                message: That link is reserved. Try another.
            validation:
              value:
                code: VALIDATION_ERROR
                message: Your bio can be up to 150 characters.
            fileTooLarge:
              value:
                code: FILE_TOO_LARGE
                message: That image is too large.
            fileTypeNotAllowed:
              value:
                code: FILE_TYPE_NOT_ALLOWED
                message: Use a JPEG, PNG or WebP image.
    NotSeller:
      description: The user is not a seller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_SELLER
            message: Start selling first to create a store.
    RateLimited:
      description: Too many requests. Retry-After says how many seconds to wait.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next attempt is allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Too many attempts. Try again in 60 seconds.
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Something went wrong on our side. Please try again.

  examples:
    MeSeller:
      value:
        id: usr_01HZX3K9Q2
        username: adaeze
        displayName: Adaeze Okafor
        avatarUrl: null
        bio: Textile designer in Yaba.
        phone: '+2348031234567'
        email: adaeze@example.com
        emailVerified: true
        interests: [fashion, art]
        roles: [buyer, seller]
        store:
          id: str_01HZX3M1A7
          slug: adaezeprints
          name: Adaeze Prints
          avatarUrl: null
          location: Yaba, Lagos
          verified: true
          followerCount: 12480
        createdAt: '2026-10-02T09:15:00Z'
    MeNewSeller:
      value:
        id: usr_01J0NEW
        username: chidi_n
        displayName: Chidi Nwosu
        avatarUrl: null
        bio: null
        phone: '+2348091112222'
        email: null
        emailVerified: false
        interests: [education]
        roles: [buyer, seller]
        store: null
        createdAt: '2026-11-28T09:58:00Z'
    OtpChallengeSms:
      value:
        challengeId: otp_01J0ABCXYZ
        channel: sms
        sentTo: '+234 803 *** 4567'
        expiresAt: '2026-11-28T10:05:00Z'
        resendAvailableAt: '2026-11-28T10:01:00Z'
    AuthSessionNewUser:
      value:
        accessToken: at_1a2b3c4d5e
        accessTokenExpiresAt: '2026-11-28T10:15:00Z'
        refreshToken: rt_9d8c7b6a5f4e
        isNewUser: true
        user:
