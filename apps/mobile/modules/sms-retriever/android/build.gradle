plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsretriever'
version = '0.1.0'

android {
  namespace "expo.modules.smsretriever"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google SMS Retriever API: reads the one SMS that carries this app's hash. No SMS permission.
  implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
  // ContextCompat.registerReceiver with export flags (Android 14+)
  implementation "androidx.core:core:1.13.1"
}
